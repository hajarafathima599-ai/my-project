<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Results - Quizify</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-mortarboard-fill me-2"></i>Quizify
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#about">About Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="quiz.html" id="nav-quiz-link">Quiz</a>
                    </li>
                    <li class="nav-item ms-lg-3 mt-3 mt-lg-0">
                        <a class="btn btn-secondary-custom" href="#" id="nav-login-btn">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-8">
                    <div class="result-card p-5 text-center">
                        <div class="mb-4">
                            <i id="resultIcon" class="bi bi-trophy text-warning" style="font-size: 4rem;"></i>
                        </div>

                        <h2 class="fw-bold mb-3" id="resultMessage">Calculating...</h2>
                        <p class="text-muted mb-4">You have completed the quiz.</p>

                        <div class="bg-light rounded p-4 mb-4 border">
                            <div class="row g-0 align-items-center">
                                <div class="col-6 border-end">
                                    <h1 class="display-4 fw-bold text-primary mb-0" id="scoreDisplay">0</h1>
                                    <p class="text-muted small mb-0 text-uppercase tracking-wide">Correct</p>
                                </div>
                                <div class="col-6">
                                    <h1 class="display-4 fw-bold text-secondary mb-0" id="totalDisplay">0</h1>
                                    <p class="text-muted small mb-0 text-uppercase tracking-wide">Total Questions</p>
                                </div>
                            </div>
                        </div>

                        <div class="d-grid gap-3 d-md-flex justify-content-md-center mt-5">
                            <a href="quiz.html" class="btn btn-primary-custom px-4">Restart Quiz <i
                                    class="bi bi-arrow-repeat ms-2"></i></a>
                            <a href="index.html" class="btn btn-outline-secondary px-4">Back to Home</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p class="mb-0">&copy; 2026 Quizify Interactive Web Application. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <!-- Result Logic Init -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const score = sessionStorage.getItem("quizify_score");
            const total = sessionStorage.getItem("quizify_total");

            if (score === null || total === null) {
                // Not coming from the quiz, redirect
                window.location.replace("quiz.html");
                return;
            }

            const scoreDisplay = document.getElementById("scoreDisplay");
            const totalDisplay = document.getElementById("totalDisplay");
            const resultMessage = document.getElementById("resultMessage");
            const resultIcon = document.getElementById("resultIcon");

            scoreDisplay.textContent = score;
            totalDisplay.textContent = total;

            const percentage = (parseInt(score) / parseInt(total)) * 100;

            if (percentage === 100) {
                resultMessage.textContent = "Excellent Work!";
                resultMessage.className = "fw-bold mb-3 text-success";
                resultIcon.className = "bi bi-trophy-fill text-warning";
            } else if (percentage >= 60) {
                resultMessage.textContent = "Good Attempt!";
                resultMessage.className = "fw-bold mb-3 text-primary";
                resultIcon.className = "bi bi-hand-thumbs-up-fill text-primary";
            } else {
                resultMessage.textContent = "Try Again!";
                resultMessage.className = "fw-bold mb-3 text-danger";
                resultIcon.className = "bi bi-exclamation-circle-fill text-danger";
            }
        });
    </script>
</body>

</html>
