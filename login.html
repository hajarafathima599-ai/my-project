<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Quizify</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-mortarboard-fill me-2"></i>Quizify
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#about">About Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="nav-quiz-link">Quiz</a>
                    </li>
                    <li class="nav-item ms-lg-3 mt-3 mt-lg-0">
                        <a class="btn btn-primary-custom" href="login.html" id="nav-login-btn">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8 col-xl-7">
                    <div class="auth-card p-0">
                        <div class="row g-0">
                            <!-- Image Column -->
                            <div
                                class="col-md-5 d-none d-md-flex align-items-center justify-content-center bg-light p-4">
                                <img src="images/login_illustration.png" alt="Student learning online"
                                    class="auth-illustration img-fluid drop-shadow"
                                    onerror="this.src='https://illustrations.popsy.co/blue/student-going-to-school.svg'">
                            </div>
                            <!-- Form Column -->
                            <div class="col-md-7 p-4 p-md-5">
                                <div class="text-center mb-4">
                                    <h2 class="fw-bold">Welcome Back!</h2>
                                    <p class="text-muted">Login to continue your learning journey.</p>
                                </div>

                                <form id="loginForm">
                                    <div class="mb-3">
                                        <label for="username" class="form-label fw-medium"><i
                                                class="bi bi-person me-2"></i>Username</label>
                                        <input type="text" class="form-control" id="username"
                                            placeholder="Enter your username">
                                        <div id="usernameError" class="error-text d-none">Username is required.</div>
                                    </div>
                                    <div class="mb-4">
                                        <label for="password" class="form-label fw-medium"><i
                                                class="bi bi-lock me-2"></i>Password</label>
                                        <input type="password" class="form-control" id="password"
                                            placeholder="Enter your password">
                                        <div id="passwordError" class="error-text d-none">Password is required.</div>
                                    </div>
                                    <div class="d-grid mb-3">
                                        <button type="submit" class="btn btn-primary-custom">Login to Start Quiz <i
                                                class="bi bi-box-arrow-in-right ms-2"></i></button>
                                    </div>
                                    <div id="loginAlert" class="alert alert-danger d-none" role="alert">
                                        Please fill in both fields.
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p class="mb-0">&copy; 2026 Quizify Interactive Web Application. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
